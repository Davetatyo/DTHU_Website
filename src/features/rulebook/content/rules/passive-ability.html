				<p>Néhány karakter rendelkezik passzív képességgel, amelyet a táblán a képesség neve és a képesség hatása jelöl. A passzív képességek hatásuk leírását tartalmazzák, és a használatuk módja változó. Kérjük, figyelmesen olvasd el az egyes passzív képességeket.</p>
